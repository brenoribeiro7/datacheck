[project]
name = "datacheck-backend"
version = "0.0.0"
description = "DataCheck backend application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.6.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "polars==1.43.2",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.2",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.uv]
package = false
